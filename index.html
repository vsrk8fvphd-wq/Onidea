<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ON:IDEA</title>

  <style>
    * {

    body {

    }

    .app {

      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
    }

    header {
      padding: 28px 22px 18px;
      background: #f7f5ef;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #3156d3;
    }

    .hero {
      padding: 34px 22px 30px;
      background: #f7f5ef;
    }

    .eyebrow {
      font-size: 14px;
      font-weight: 700;
      color: #3156d3;
      margin-bottom: 10px;

    h1 {

      margin: 16px 0 0;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    .main {
      padding: 22px;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 19px;
      background: #3156d3;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary {
      width: 100%;
      border: 1px solid #e3e3e3;
      border-radius: 18px;
      padding: 17px;
      margin-top: 10px;
      background: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 32px 0 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -1px;
    }

    .section-title span {
      color: #888;
      font-size: 13px;
    }

    .idea-card {
      padding: 19px;
      border: 1px solid #e9e9e9;
      border-radius: 18px;
      margin-bottom: 12px;
      background: white;
    }

    .tag {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 8px;
      background: #eef2ff;
      color: #3156d3;
      font-size: 12px;
      font-weight: 700;
    }

    .idea-card h3 {
      margin: 12px 0 7px;
      font-size: 17px;
      letter-spacing: -0.5px;
    }

      margin: 0;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
