  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hpxkhtkhzusudseewzjc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HxGIiny_jdgL15aYHBSfgQ_Dd69Sdxa";

    async function loadIdeas() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/ideas?select=id,title,content,problem,effect,category,status,created_at,like_count&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(`Supabase 오류: ${response.status}`);
    }

    const ideas = await response.json();

    console.log("Supabase 아이디어:", ideas);
    window.currentIdeas = ideas;
renderIdeas(ideas);
    return ideas;

  } catch (error) {
    console.error("아이디어 불러오기 실패:", error);
    return [];
  }
}
    const supabaseClient = window.supabase.createClient(
     SUPABASE_URL,
     SUPABASE_PUBLISHABLE_KEY
    );
    function filterIdeas(category, selectedButton) {
  const cards = document.querySelectorAll(".idea-card");
  const buttons = document.querySelectorAll(".filter-btn");

  // 선택된 버튼 표시
  buttons.forEach(button => {
    button.classList.remove("active");
  });

  selectedButton.classList.add("active");

  // 카드 필터링
  cards.forEach(card => {
    const tag = card.querySelector(".tag");

    if (!tag) return;

    const cardCategory = tag.textContent.trim();

    if (category === "전체" || cardCategory === category) {
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
  });
}
    function submitIdea() {
      window.location.href = "https://naver.me/5B0IPY1y";
    }

    function scrollToIdeas() {
      document.getElementById("ideas").scrollIntoView({
        behavior: "smooth"
      });
    }
async function loadLikeStatus() {
  const buttons = document.querySelectorAll(".like[data-idea-id]");

  for (const button of buttons) {
    const ideaId = Number(button.dataset.ideaId);
    const number = button.querySelector("span");

    const { data, error } = await supabaseClient
      .from("idea_votes")
      .select("id, voter_key")
      .eq("idea_id", ideaId);

    if (error) {
      console.error("공감 상태 불러오기 실패:", error);
      continue;
    }

    number.textContent = data.length;

    const myVote = data.some(
      vote => vote.voter_key === voterKey
    );

    if (myVote) {
      button.classList.add("active");
    } else {
      button.classList.remove("active");
    }
  }
}
    const voterKey =
  localStorage.getItem("onidea_voter_key") || crypto.randomUUID();

localStorage.setItem("onidea_voter_key", voterKey);
async function likeIdea(button) {
  const ideaId = Number(button.dataset.ideaId);
  const number = button.querySelector("span");

  // 내가 이미 공감했는지 확인
  const { data: existingVote, error: checkError } = await supabaseClient
    .from("idea_votes")
    .select("id")
    .eq("idea_id", ideaId)
    .eq("voter_key", voterKey)
    .maybeSingle();

  if (checkError) {
    console.error("공감 확인 실패:", checkError);
    alert("공감 확인에 실패했어요.");
    return;
  }

  if (existingVote) {
    // 이미 공감한 경우 → 공감 취소
    const { error } = await supabaseClient
      .from("idea_votes")
      .delete()
      .eq("id", existingVote.id);

    if (error) {
      console.error("공감 취소 실패:", error);
      alert("공감 취소에 실패했어요.");
      return;
    }

    button.classList.remove("active");
    number.textContent = Number(number.textContent) - 1;

  } else {
    // 아직 공감하지 않은 경우 → 공감
    const { error } = await supabaseClient
      .from("idea_votes")
      .insert({
        idea_id: ideaId,
        voter_key: voterKey
      });

    if (error) {
      console.error("공감 저장 실패:", error);
      alert("공감 저장에 실패했어요.");
      return;
    }

    button.classList.add("active");
    number.textContent = Number(number.textContent) + 1;
  }
}
loadIdeas().then(() => {
  loadLikeStatus();
});
function renderIdeas(ideas) {
  const list = document.querySelector(".idea-list");

  if (!list) return;

  list.innerHTML = "";

  ideas.forEach(idea => {
    const card = document.createElement("div");
    card.className = "idea-card";

    card.innerHTML = `
      <span class="tag">${idea.category}</span>

      <h3>${idea.title}</h3>

      <p>
        ${idea.content}
      </p>

<div class="idea-bottom">
  <button
    class="more"
    onclick="showIdeaDetail(${idea.id})"
  >
    자세히 보기 〉
  </button>

  <button
    class="like"
    data-idea-id="${idea.id}"
    onclick="likeIdea(this)"
  >
    👍 공감 <span>${idea.like_count || 0}</span>
  </button>
</div>
    `;

    list.appendChild(card);
  });
}
    function showIdeaDetail(id) {
  const idea = window.currentIdeas?.find(item => item.id === id);

  if (!idea) return;

  document.getElementById("modalCategory").textContent =
    idea.category || "";

  document.getElementById("modalTitle").textContent =
    idea.title || "";

  document.getElementById("modalContent").textContent =
    idea.content || "";

  document.getElementById("modalProblem").textContent =
    idea.problem || "내용 없음";

  document.getElementById("modalEffect").textContent =
    idea.effect || "내용 없음";

  document.getElementById("ideaModal").classList.add("show");
}

function closeIdeaDetail() {
  document.getElementById("ideaModal").classList.remove("show");
}
    function showBestIdeas() {
  alert("BEST IDEA 함수 실행!");
      const list = document.getElementById("bestIdeaList");

  if (!list || !window.currentIdeas) return;

  const bestIdeas = [...window.currentIdeas]
    .sort((a, b) => (b.like_count || 0) - (a.like_count || 0))
    .slice(0, 5);

  list.innerHTML = "";

  bestIdeas.forEach((idea, index) => {
    const item = document.createElement("button");

    item.className = "best-idea-item";

    item.onclick = function () {
      closeBestIdeas();
      showIdeaDetail(idea.id);
    };

    item.innerHTML = `
      <div class="best-rank">
        ${index + 1}
      </div>

      <div class="best-info">
        <span class="tag">${idea.category}</span>
        <h3>${idea.title}</h3>
      </div>

      <div class="best-like">
        👍 ${idea.like_count || 0}
      </div>
    `;

    list.appendChild(item);
  });

  document.getElementById("bestIdeaModal").classList.add("show");
}

function closeBestIdeas() {
  document.getElementById("bestIdeaModal").classList.remove("show");
}
  </script>
<div id="ideaModal" class="idea-modal">
  <div class="idea-modal-content">

    <button class="idea-modal-close" onclick="closeIdeaDetail()">
      ×
    </button>

    <span id="modalCategory" class="tag"></span>

    <h2 id="modalTitle"></h2>

    <div class="modal-section">
      <h4>❓ 문제점</h4>
      <p id="modalProblem"></p>
    </div>

    <div class="modal-section">
      <h4>💡 개선 아이디어</h4>
      <p id="modalContent"></p>
    </div>

    <div class="modal-section">
      <h4>✨ 기대효과</h4>
      <p id="modalEffect"></p>
    </div>

  </div>
<div id="bestIdeaModal" class="idea-modal">
  <div class="idea-modal-content best-idea-content">

    <button class="idea-modal-close" onclick="closeBestIdeas()">
      ×
    </button>

    <h2>🏆 BEST IDEA</h2>

    <p class="best-idea-subtitle">
      가장 많은 공감을 받은 아이디어 TOP 5
    </p>

    <div id="bestIdeaList"></div>

  </div>
</div>
</body>
</html>
